    - "Reckitt_chamsocnhacua"
    - "ufood_store"
    - "mondelezkinhdovn"
    # July 2026 onboarded stores. Each one appears in the July windows with
    # revenue AND in the team's own month-end master (its "by brand" tab carries
    # pepsicofoods 787,342,007, xa kho gia tot 44,201,866 and tolpa 20,126,780
    # under Shopee), so these are real storefronts and not a naming accident.
