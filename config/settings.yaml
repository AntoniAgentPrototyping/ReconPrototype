# settings.yaml — global pipeline configuration
#
# Column maps corrected against REAL May-2026 exports on 2026-07-16
# (TikTok order file "7. Order U food 17.05.xlsx", income "7. income U food.xlsx").
#
# This header used to point at `tools/sample_config/settings.yaml` for the
# pre-sample placeholder maps. That directory does not exist — it went with the
# placeholder path in M1, and the reference outlived it by three milestones.
# The synthetic smoke test builds its own settings (tools/smoke_test.py).

# VAT model (confirmed by the team): ONE default factor plus per-SKU
# exceptions from the team-owned master file below. The 8% rate is a
# TEMPORARY tax concession — when it reverts to 10%, change the single
# `default:` line to 1.10 and nothing else.
vat_factors:
  default: 1.08

# Team-owned master (additive-only, maintained by the team): fee-type
# mapping (Lib sheet) + per-SKU VAT exceptions (VAT sheet). Read live at
# runtime; the lazada_*.csv snapshots are the fallback, and live-vs-snapshot
# drift is reported on every run (src/masters.py).
masters_file: "Lib & VAT rate.xlsb"

# Force a specific Excel engine per platform/kind. June 2026 TikTok order
# exports ship a broken <dimension> tag that the default openpyxl reader
# truncates to one column; calamine ignores the dimension and reads the real
# cells (and reads well-formed May files identically). Everything not listed
# here keeps the default openpyxl fast path + single-column calamine fallback.
reader_engine:
  tiktok:
    orders: calamine
  # Shopee via openpyxl took 45+ min per window once OneDrive sync began
  # competing for the disk (Aug 2026); calamine reads the same files in
  # minutes and every July diagnostic already validated it on these exact
  # exports. Output totals are tie-checked after any engine change.
  shopee:
    orders: calamine
    income: calamine

tolerances:
  # The team's OWN tolerance checks, read from their TikTok workbooks
  # ("Tiktok result 01 to 17T5 For KA.xlsx"):
  #   'PV sum'!E3     = IF(ABS(E2)<12000, "OK", "check lai sai roi")
  #   'Xuat HD bt'!P5 = IF(ABS(O5)<2000, "ok có thể xuất HD", "Cần check lại số có vấn đề")
  #   'PV xuat HD'!I1 = IF(ABS(H1)<1000, "ok có thể xuất HD", "Cần check lại số có vấn đề")
  tiktok:
    pv_sum_vnd: 12000       # pre-VAT: per-store totals vs per-VAT-bucket totals
    xuat_hd_vnd: 2000       # with-VAT: line totals vs VAT-bucket recombination
    pv_xuat_hd_vnd: 1000    # pre-VAT: line totals vs SKU-pivot recombination
  # Shopee's own checks (For KA "shopee result Sample For KA 01 to 10T05.xlsx"):
  #   'PV sum'!G3    = IF(ABS(E2)<2000,...)   — NOT TikTok's 12,000
  #   'Xuat HD bt'!R5 = IF(ABS(Q5)<2000,...)
  #   'return'!R7    = IF(ABS(Q7)<10, "Return full ko xuat HD",
  #                       "Return 1 phan phai xuat HD") — the finance-file
  #     Return-tab split: recomputed order total + refund within 10 VND of
  #     zero = full return (skip invoice), else partial (must invoice).
  shopee:
    # NOTE: Shopee has no pv_sum_vnd. Its pivot-drift check does NOT read one —
    # build_shopee uses the TOL_PIVOT_DRIFT_SHOPEE constant. A key was configured
    # here at 2000 and read by nothing; removed 2026-08-18 rather than left to
    # look like a control (docs/14-PRODUCTION-READINESS.md A12).
    xuat_hd_vnd: 2000
    return_full_vnd: 10
    # The order-file-vs-income-file revenue crossing (src/tieout.py,
    # RevenueCrossing). MEASURED exact before it was asserted, on four
    # independent windows: 0 deviating orders of 48,535 / 14,831 / 16,873
    # (May s1/s2/s3) and 1 of 81,232 in the team's own June consolidated file.
    # 1 VND because the relation is exact, not because 1 VND is a nice number.
    conservation_vnd: 1

# Settlement-window bounds — DEDUPLICATION OF A PULL ARTIFACT, not a rule.
# A window's finance file may only contain settlements dated inside its own
# labelled window. Add an entry ONLY when a raw export was pulled with the
# wrong start/end date AND its out-of-window rows are proven to be already
# present in the adjacent window. Evidence goes in the comment.
#
# 2026-07_w2 (verified 2026-08-07, tools scratch w2_boundary.py): the team's
# "Tiktok 2026_08 to 14 July" export also carried the whole 7-July settlement
# block (24,251 revenue rows — exactly the 24,251 rows w1 holds for 7 July)
# plus 256 stray rows dated 01-06 July. Every one of those orders is already
# in w1 ("01 to 07T07"), which legitimately owns settlements through 7 July.
# Rows settled 08-14 July whose orders also appear in w1 (1,180 rows) are
# genuine second payout events and are KEPT.
#
# DO NOT add "2026-07_w5": from 2026-07-29. Measured 2026-08-19, and it is the
# trap this rule's second condition exists to catch. The 29-31 July TikTok folder
# holds "16. Income Curel 07.xlsx", spanning 2026-07-01..2026-07-31 — 849 rows, of
# which 772 settle before 29 July. It looks exactly like the w2 mis-pull and it is
# the opposite: it is the ONLY Curel income file in the entire July dump. The team
# pulled that storefront once, at month end, for the whole month. Its 772 early
# rows carry 230,946,293 VND that appears in NO other window, so bounding w5 would
# delete a quarter of a billion dong and leave a window that still ties to itself.
# `tools/stage_exports.py` reports it as a candidate mis-pull, which is correct —
# a candidate is not a finding. The team's own month-end master agrees: its TikTok
# tab shows Curel revenue in the 29-31 column and nowhere else.
window_settlement_bounds:
  "2026-07_w2":
    from: "2026-07-08"

# TikTok amounts parse as standard (1234567.89). Re-verify per platform.
number_style: standard

# What to do with an amount cell that cannot be parsed under number_style.
#   hard_stop (default) — name the column and the row count, produce nothing
#   warn                — log it and continue; the cell becomes 0 VND
# Blank cells and the Excel accounting dash ("-") are NOT unparseable: they
# mean zero and are parsed as 0.0. Measured 2026-08-13 — a real Shopee income
# export writes the dash in 46,972 of 83,134 rows of seller_ship_support, a
# column that feeds the discount allocation, and both windows have ZERO
# genuinely unparseable cells. Anything that does fail here is far more likely
# a monthly format change (a Vietnamese-styled column, a currency suffix) than
# real data, and it used to become silent zero revenue
# (docs/08-KNOWN-DEFECTS.md#16).
numeric_coercion: hard_stop

# Drop raw columns that aren't in the column maps at read time: strips PII
# immediately (the team's Shopee M code does the same) and keeps full-
# platform runs within memory. Nothing downstream reads unmapped columns.
drop_unmapped_columns: true

# NO row dedupe on real data: byte-identical order lines are legitimate
# (duplicated gift SKUs — Sanofi Shopee May, team qty 2 vs deduped 1), and
# the team's Power Query never dedupes. Overlap protection comes from the
# one-period-folder-per-settlement-window layout instead.
dedupe_rows: false

# An order settled in this window may have been CREATED earlier, so its SKU lines
# sit in a previous window's order export and the explode finds nothing. The
# revenue then leaves the invoice through the documented "~21% unmatched" door,
# quietly, because that door is expected to have traffic. July's first external
# month-end comparison measured 4,527,401,608 VND going out that way — 11 of 205
# store-window cells, every one this cause (docs/08-KNOWN-DEFECTS.md#212).
#
#   off     today's behaviour, bit for bit. Every committed golden was produced
#           under this.
#   report  measure it: a tie-out INFO row, an exceptions sheet and log lines
#           naming which window holds the lines. Changes NO number — the orders
#           frame handed to the explode is untouched.
#   apply   borrow those lines before the explode. This MOVES CELLS.
#
# Now `apply` (2026-08-20). It ran as `report` in production from 2026-08-19, and
# the flip was taken on measured evidence rather than on the mechanism looking
# right:
#
#   * Every golden window was pre-stated to move ZERO cells, and did. `2026-05_w1`
#     and `_s1` are the first of their month so they have no predecessor at all;
#     `_s2`/`_s3` report 100% own-window order coverage, so the borrow returns
#     before opening a file; the four Lazada windows are a fee-event ledger with no
#     order files and the step is not wired into `_run_lazada`. The money gate
#     re-ran all eight at zero tolerance after the flip and no cell moved, so NO
#     golden was re-baselined for this change.
#   * The July recovery was measured twice, by two independent implementations that
#     now agree: w2 942,869,056 VND (abbott 941,081,056 + similac 1,788,000),
#     s4 1,390,095,674 (masan, bounded by s3's coverage), s2 173,429.
#   * The safety property is tested, not just asserted: a predecessor export whose
#     quantities have drifted BREACHES per-order conservation instead of being
#     invoiced (tests/test_backfill.py, through the real explode and tie-out).
#
# `purite` and `mondelez kinh do` recover NOTHING and no mode can change that —
# their w2 order files are byte-identical mis-pulls, so the lines were never
# exported. That residual needs a platform re-pull.
#
# Service runs of a PINNED window keep whatever mode they were pinned to, which is
# the point of pinning: re-running July on the service needs a deliberate repin.
#
# Do NOT "fix" this by pooling the month's order files instead. Measured: pooling
# every July TikTok order export into w2 takes that window to 183,102,704,362 VND
# against a reference of 40,060,544,029 — a 4.5x over-count, because the same
# order line appears in several exports and the explode sums quantity per
# (store, order_id, sku_id, sku_name, unit_price_gross) bucket, so a second copy
# inflates quantity INSIDE one SKU line rather than adding a visible row.
# Borrowing takes each order from exactly ONE window (src/backfill.py, D59).
cross_window_order_backfill: apply

# Date parsing: set true per platform if exports use dd/mm/yyyy text dates.
# TikTok confirmed dd/mm/yyyy (probe with false produced impossible Jan-Dec
# ranges for a May-only window).
#
# ONLY consulted where date_formats below has no entry. dayfirst is per-PLATFORM
# and the formats are per-KIND, which is the defect it cannot express: TikTok
# orders really are dd/mm/yyyy while TikTok income is yyyy/mm/dd, and one flag
# cannot be right for both.
dayfirst:
  tiktok: true
  shopee: false   # TODO verify when Shopee is mapped

# Explicit strptime format per platform/kind, applied to every date column of
# that kind. Takes precedence over dayfirst.
#
# WHY THIS EXISTS, measured 2026-08-19. pandas infers a format from the first
# non-null element and dayfirst only decides the AMBIGUOUS case, so which format
# it picks is data-dependent. Real TikTok income is `%Y/%m/%d` against
# `dayfirst.tiktok: true`, and July is where that finally bit: the first value of
# `Order settled time` is `2026/07/07`, ambiguous between %Y/%m/%d and %Y/%d/%m,
# so pandas honoured dayfirst and read the whole column as %Y/%d/%m. July
# settlement dates came out spanning 2026-01-07..2026-09-07 for a window that is
# entirely 1-7 July, and `tools/stage_exports.py` could not derive a single
# window. May escaped it only because its first value happened to be unambiguous.
#
# Every value below was measured against real exports rather than assumed: each
# format parses 100% of the non-blank cells in its date columns, in BOTH the May
# set (the golden windows) and the July set, across 10 files per platform/kind.
# The probe is recorded in docs/07-VERIFICATION.md.
#
# Explicit parsing is deliberately STRICTER than inference: a cell that does not
# match becomes NaT, which `ingest.report_undated` counts and names rather than
# dropping silently.
date_formats:
  tiktok:
    orders: "%d/%m/%Y %H:%M:%S"   # Created Time
    income: "%Y/%m/%d"            # Order settled time, Order created time
  shopee:
    orders: "%Y-%m-%d %H:%M"      # Ngày đặt hàng
    income: "%Y-%m-%d"            # Ngày hoàn thành thanh toán, Ngày đặt hàng
  lazada:
    # The two variants do not agree, and nothing would have said so: the
    # separator differs. 66 weekly files and 14 daily across May and July.
    weekly: "%d-%b-%Y"            # Transaction Date, e.g. 03-Jul-2026
    daily: "%d %b %Y"             # Transaction Date, e.g. 29 Jul 2026

# Rows to drop immediately after the header row. TikTok order exports have a
# per-column description row under the header ("Current order status." etc.)
# that must not be ingested as data.
skip_rows_after_header:
  tiktok:
    orders: 1

file_formats: [".xlsx", ".csv"]

# Which sheet to read per platform/kind (real exports are multi-sheet).
# null/absent = first sheet.
sheet_names:
  tiktok:
    orders: "OrderSKUList"
    income: "Order details"
  shopee:
    orders: "orders"
  # Lazada is a fee-event LEDGER, not orders+income: one row per
  # (order item x fee event) and no order files at all. The two variants are
  # different schemas, and the Daily-format week (25th-end) is a PERMANENT
  # monthly fixture — dual-schema handling is standard here, not an exception.
  # Moved out of src/lazada.py on 2026-08-18 (M8/1.7); the values are unchanged.
  lazada:
    weekly: "Transaction Overview"
    daily: "Income Overview"

# Regex sheet matching for exports that split data across numbered sheets.
# Shopee income caps sheets at ~10k rows: "Doanh thu", "Doanh thu - 1", ...
# Mirrors the team's M code (Text.Contains(name, "Doanh thu")).
sheet_patterns:
  shopee:
    income: "Doanh thu"

# 1-based row holding the real (leaf) headers. Shopee income has two
# band/group rows above it (triple PromoteHeaders in the team's M code).
header_rows:
  shopee:
    income: 3

# Neither TikTok nor Shopee exports carry a store/shop column: store identity
# is implied by the per-store download file. Derive it from the file name.
# Group 1 of the regex = store name.
store_from_filename:
  # July 2026 added new order-file suffixes: "7.7"/"14.7"/"21.7"/"28.7"
  # (single-digit second part — May only had ".05"-style) and the 29-31
  # window's "29-31" income suffix. All optional trailing tokens, never
  # part of the store name.
  # "Life14.07" (no separator before the dotted token) appears in July w2 —
  # dotted date tokens may follow the name directly; bare numeric tokens
  # still require a separator so store names are never truncated.
  tiktok: '^\s*\d+\.?\s*(?:order|income)\s+(.+?)(?:[ _]*\d{1,2}\.\d{1,2}|[ _]+\d{1,2}|[ _]+\d{2}-\d{2})?\s*\.xlsx$'
  # Shopee names: "Income Kate.xlsx", "Income. Curel.xlsx", "Income.Astroman.xlsx",
  # "Order Kao part 10.xlsx", "Order.AHC part  6.xlsx", "Order.mars.wrigley part 2.xlsx".
  # June 2026 added a leading store-number prefix: "10_Income.Reckitt...xlsx",
  # "13_Order. ufood_store.xlsx", and inconsistently "1_ Income. Curel.xlsx"
  # (space after the underscore) — (?:\d+_\s*) handles all of them + May.
  # Aug 2026: sub-window income files carry the settlement range in the name —
  # "Income. Xmenforboss 1-10.xlsx", "Income. Xmenforboss 21-end.xlsx" — which
  # parsed as the stores 'Xmenforboss 1-10' and 'Xmenforboss 21-end'. Same
  # optional-trailing-token treatment TikTok already gives "29-31", and the
  # same rule: the token must be whitespace-separated digits (or the literal
  # "end"), so a name like "Xmen 2-in-1" cannot be truncated. The 11-20 export
  # of the same store carries no suffix and proves the bare name is the real
  # one; check_stores is the backstop if this ever over-strips.
  shopee: '^\s*(?:\d+_\s*)?(?:order|income)[. ]\s*(.+?)(?:\s+part\s*\d+)?(?:\s+\d{1,2}-(?:\d{1,2}|end))?\s*\.xlsx$'
  # "15_Masan.xlsx" -> "Masan". The optional "(N)" is a BROWSER download-duplicate
  # marker, NOT part of the store name: a store's five weekly exports downloaded in
  # one session arrive as "2_KAO.xlsx", "2_KAO (1).xlsx" ... "2_KAO (4).xlsx", and
  # each is a DIFFERENT settlement week (verified Aug 2026: 05-01..03, 05-18..24,
  # 05-04..10, 05-11..17 — distinct ranges, not re-pulls). Without stripping it the
  # same storefront reads as five separate stores.
  lazada: '^\s*\d+_\s*(.+?)(?:\s*\(\d+\))?\s*\.xlsx$'

# Stores present in the May-2026 data (names as they appear in file names).
# TikTok: 17 stores in window 01-17T05; window 18-30T05 has 18 (adds
# "Nutifood Nutrition Store"). The old "26 TikTok stores" figure is NOT
# supported by this data; the requirements doc's 18 matches window 2.
# Numbering mystery RESOLVED (Hoang): #16 is the Veet & Reckitt combined
# file (Total files label it "Reckitt VN Chăm sóc cá nhân" — see aliases).
#
# KNOWN NAMING INCONSISTENCIES between Order and Income file names — these
# will break store matching on full-platform runs until an alias map is added:
#   - order "RVeet & Reckitt Personal Care" (typo) vs income "Veet & Reckitt Personal Care"
#   - order "Pediasure"                     vs income "Abbott Pediasure"
#   - order "Nutifood-Varna-Life"           vs income "Nutifood-Varna-life" (case)
# Stores that legitimately appear only in some windows: absent -> warning,
# not hard stop. "Nutifood Nutrition Store" onboarded mid-May (window 2 only).
stores_optional:
  tiktok:
    - "Nutifood Nutrition Store"
    # July 2026: not present in every weekly window
    - "Nutifood-Varna-life"
    # July 2026 onboarded stores (first seen in the July dump; presence
    # varies by window — Curel appears only in 29-31):
    - "Glucerna"
    - "Kate"
    - "Mondelez Kinh Do"
    - "Pepsico foods"
    - "Similac"
    - "Tolpa"
    - "Curel"
    # July w5 (29-31, 3-day window): these stores had zero settlements —
    # their income exports are header-only. Absence warns, never silent.
    - "Merries"
    - "Veet & Reckitt Personal Care"

expected_stores:
