# settings.yaml — global pipeline configuration
#
# !! TODO (when the first real exports arrive) !!
# The column_maps below are PLACEHOLDERS written before any sample file was
# seen. Replace every source header with the EXACT header text from the real
# platform export (Vietnamese where applicable, including units/line breaks),
# and fill expected_stores with the real store list. The pipeline hard-stops
# if a required canonical column cannot be produced from the map.

# VAT rate used by the placeholder calculation formulas.
# TODO confirm with Huong/Dashaini: 8% vs 10%, and whether it varies by category.
vat_rate: 0.08

tolerances:
  # Check 2: sum of brand-split outputs vs grand total.
  # TODO confirm: is 10,000 VND per split or cumulative?
  split_rounding_vnd: 10000
  # Checks 1 and 3 should match exactly; 1 VND absorbs float noise only.
  exact_check_vnd: 1

periods:
  # Income lines may belong to orders created in the prior month. The team's
  # download already includes the prior-month order re-pull in the same
  # orders/ folder; this window is how far back stitching will attribute.
  rolling_window_months: 2

# "standard" = 1,234,567.89   |   "vietnamese" = 1.234.567,89
# TODO confirm which format the raw exports use (may differ per platform).
number_style: standard

# Hard stop if the distinct stores found in the data don't equal this list.
# Empty list = check skipped with a loud warning (not yet configured).
# TODO replace sample values with the real store list per platform.
expected_stores:
  tiktok:
    - "Keoh Official Store"
    - "Meko Official Store"
  shopee:
    - "Keoh Official Store"
    - "Meko Official Store"

# Brand is derived from store. TODO replace with the real store→brand map.
store_to_brand:
  "Keoh Official Store": keoh
  "Meko Official Store": meko

column_maps:
  tiktok:
    orders:
      # source header (exact text in file)  →  canonical name
      "Order ID": order_id
      "SKU ID": sku_id
      "Product Name": sku_name
      "Quantity": quantity
      "SKU Unit Original Price": unit_price_gross
      "Created Time": order_created_at
      "Shop Name": store
    income:
      "Order/adjustment ID": order_id
      "Shop Name": store
      "Total revenue": gross_revenue
      "Actual refund": actual_refund
      "Total settlement amount": net_revenue
      "Statement date": statement_date
  shopee:
    orders:
      "Mã đơn hàng": order_id
      "SKU phân loại hàng": sku_id
      "Tên sản phẩm": sku_name
      "Số lượng": quantity
      "Giá gốc": unit_price_gross
      "Ngày đặt hàng": order_created_at
      "Tên Shop": store
    income:
      "Mã đơn hàng": order_id
      "Tên Shop": store
      "Doanh thu": gross_revenue
      "Hoàn tiền thực tế": actual_refund
      "Doanh thu thuần": net_revenue
      "Ngày sao kê": statement_date
